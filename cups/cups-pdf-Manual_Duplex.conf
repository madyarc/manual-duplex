# cups-pdf instance used by the "Manual_Duplex" CUPS queue
# (device URI cups-pdf:/Manual_Duplex reads this file instead of cups-pdf.conf).
#
# Every finished job — with the print dialog's layout options such as
# "2 pages per sheet" already applied — is written as a PDF into the
# user's spool folder, where manual-duplex.path picks it up.

# Must match DirectoryNotEmpty= in manual-duplex.path
Out ${HOME}/.cache/manual-duplex/spool

# Jobs from users without a local account (the queue is not shared anyway)
AnonDirName /var/spool/cups-pdf/ANONYMOUS

# File name: job_<id>-<title>.pdf — the job id keeps names unique
Label 1
TitlePref 1

# Only the owner may read the spooled PDFs
UserUMask 0077

# Drop a 3-letter extension from the title (report.odt -> report)
Cut 3
